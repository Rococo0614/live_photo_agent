<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#5a7bab"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#9aa5b4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#f0f4f9"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2a44">Live Photo Agent — 架构总览</text>

  <!-- ============ UI / API Layer ============ -->
  <rect x="30" y="60" width="1040" height="100" rx="12" fill="#dbe8f5" stroke="#5a7bab" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="82" font-size="12" font-weight="bold" fill="#3a5a8a">前端 &amp; API 接入层</text>

  <!-- ui.html -->
  <rect x="60" y="92" width="160" height="52" rx="8" fill="#fff" stroke="#7aa0cc" stroke-width="1.2"/>
  <text x="140" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a6a">前端 UI</text>
  <text x="140" y="128" text-anchor="middle" font-size="10" fill="#555">ui.html  /  ui.py</text>

  <!-- FastAPI -->
  <rect x="270" y="92" width="200" height="52" rx="8" fill="#fff" stroke="#7aa0cc" stroke-width="1.2"/>
  <text x="370" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a6a">FastAPI 后端</text>
  <text x="370" y="128" text-anchor="middle" font-size="10" fill="#555">api.py  /  config.py</text>

  <!-- LangSmith -->
  <rect x="520" y="92" width="180" height="52" rx="8" fill="#fff" stroke="#7aa0cc" stroke-width="1.2"/>
  <text x="610" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a6a">可观测性</text>
  <text x="610" y="128" text-anchor="middle" font-size="10" fill="#555">LangSmith Tracing</text>

  <!-- offline CLI -->
  <rect x="750" y="92" width="200" height="52" rx="8" fill="#fff" stroke="#7aa0cc" stroke-width="1.2"/>
  <text x="850" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a6a">离线预处理 CLI</text>
  <text x="850" y="128" text-anchor="middle" font-size="10" fill="#555">offline_preprocess_cli.py</text>

  <!-- ============ Execution / Orchestration Layer ============ -->
  <rect x="30" y="185" width="1040" height="120" rx="12" fill="#d4edda" stroke="#4a9a6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="207" font-size="12" font-weight="bold" fill="#1a6a3a">执行编排层</text>

  <!-- LivePhotoAgent -->
  <rect x="60" y="217" width="170" height="72" rx="8" fill="#fff" stroke="#4a9a6a" stroke-width="1.2"/>
  <text x="145" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a2a">LivePhotoAgent</text>
  <text x="145" y="253" text-anchor="middle" font-size="10" fill="#555">execution/agent.py</text>
  <text x="145" y="267" text-anchor="middle" font-size="10" fill="#888">请求入口 · 结果聚合</text>

  <!-- InputPreprocessor -->
  <rect x="270" y="217" width="170" height="72" rx="8" fill="#fff" stroke="#4a9a6a" stroke-width="1.2"/>
  <text x="355" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a2a">输入预处理</text>
  <text x="355" y="253" text-anchor="middle" font-size="10" fill="#555">InputPreprocessor</text>
  <text x="355" y="267" text-anchor="middle" font-size="10" fill="#888">资产加载 · 摘要构建</text>

  <!-- PlannerGraphRunner -->
  <rect x="480" y="217" width="185" height="72" rx="8" fill="#fff" stroke="#4a9a6a" stroke-width="1.2"/>
  <text x="572" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a2a">Graph Runner</text>
  <text x="572" y="253" text-anchor="middle" font-size="10" fill="#555">langgraph_runner.py</text>
  <text x="572" y="267" text-anchor="middle" font-size="10" fill="#888">规划→校验→重规划→执行</text>

  <!-- FoundationLayer / FlowLayer -->
  <rect x="705" y="217" width="170" height="72" rx="8" fill="#fff" stroke="#4a9a6a" stroke-width="1.2"/>
  <text x="790" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a2a">Flow / State</text>
  <text x="790" y="253" text-anchor="middle" font-size="10" fill="#555">flow.py · state.py</text>
  <text x="790" y="267" text-anchor="middle" font-size="10" fill="#888">Pipeline Trace 追踪</text>

  <!-- MemoryService -->
  <rect x="910" y="217" width="140" height="72" rx="8" fill="#fff" stroke="#4a9a6a" stroke-width="1.2"/>
  <text x="980" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a2a">Memory</text>
  <text x="980" y="253" text-anchor="middle" font-size="10" fill="#555">memory.py</text>
  <text x="980" y="267" text-anchor="middle" font-size="10" fill="#888">可复用策略记忆</text>

  <!-- ============ Brain / Planner Layer ============ -->
  <rect x="30" y="330" width="490" height="110" rx="12" fill="#fce8d5" stroke="#c87a3a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="352" font-size="12" font-weight="bold" fill="#7a3a0a">规划器层（Brain）</text>

  <!-- QwenPlanner -->
  <rect x="55" y="362" width="170" height="62" rx="8" fill="#fff" stroke="#c87a3a" stroke-width="1.2"/>
  <text x="140" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a2a0a">QwenPlanner</text>
  <text x="140" y="399" text-anchor="middle" font-size="10" fill="#555">brain.py</text>
  <text x="140" y="413" text-anchor="middle" font-size="10" fill="#888">生成 ExecutionPlan</text>

  <!-- Contracts -->
  <rect x="260" y="362" width="230" height="62" rx="8" fill="#fff" stroke="#c87a3a" stroke-width="1.2"/>
  <text x="375" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a2a0a">ToolContracts</text>
  <text x="375" y="399" text-anchor="middle" font-size="10" fill="#555">contracts.py · CapabilityLayer</text>
  <text x="375" y="413" text-anchor="middle" font-size="10" fill="#888">工具描述 · 依赖校验</text>

  <!-- LLM backend -->
  <rect x="560" y="330" width="510" height="110" rx="12" fill="#ede8f8" stroke="#7a5aab" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="352" font-size="12" font-weight="bold" fill="#3a1a7a">LLM 后端</text>

  <rect x="585" y="362" width="180" height="62" rx="8" fill="#fff" stroke="#7a5aab" stroke-width="1.2"/>
  <text x="675" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2a8a">Qwen Omni / API</text>
  <text x="675" y="399" text-anchor="middle" font-size="10" fill="#555">HTTP endpoint</text>
  <text x="675" y="413" text-anchor="middle" font-size="10" fill="#888">DashScope 兼容接口</text>

  <rect x="805" y="362" width="240" height="62" rx="8" fill="#fff" stroke="#7a5aab" stroke-width="1.2"/>
  <text x="925" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2a8a">LocalHF Planner</text>
  <text x="925" y="399" text-anchor="middle" font-size="10" fill="#555">LocalHFPlannerRuntime</text>
  <text x="925" y="413" text-anchor="middle" font-size="10" fill="#888">本地 Hugging Face 模型</text>

  <!-- ============ Capability Layer ============ -->
  <rect x="30" y="465" width="1040" height="185" rx="12" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="487" font-size="12" font-weight="bold" fill="#7a5a0a">能力层（Capability）— ToolRegistry</text>

  <!-- L0 -->
  <rect x="55" y="498" width="500" height="136" rx="8" fill="#fffbee" stroke="#d4a017" stroke-width="1"/>
  <text x="305" y="516" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6000">L0 原子工具</text>

  <!-- L0 tools grid: row 1 -->
  <rect x="65" y="524" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="120" y="537" text-anchor="middle" font-size="9" fill="#333">scan_library</text>
  <text x="120" y="549" text-anchor="middle" font-size="9" fill="#333">filter_selected</text>

  <rect x="185" y="524" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="240" y="537" text-anchor="middle" font-size="9" fill="#333">extract_key_frames</text>
  <text x="240" y="549" text-anchor="middle" font-size="9" fill="#333">estimate_motion_score</text>

  <rect x="305" y="524" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="360" y="537" text-anchor="middle" font-size="9" fill="#333">select_cover_frame</text>
  <text x="360" y="549" text-anchor="middle" font-size="9" fill="#333">set_display_frame</text>

  <rect x="425" y="524" width="115" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="482" y="537" text-anchor="middle" font-size="9" fill="#333">subject_segmentation</text>
  <text x="482" y="549" text-anchor="middle" font-size="9" fill="#333">stabilize_clip</text>

  <!-- L0 tools grid: row 2 -->
  <rect x="65" y="566" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="120" y="579" text-anchor="middle" font-size="9" fill="#333">clip_trim</text>
  <text x="120" y="591" text-anchor="middle" font-size="9" fill="#333">clip_speed</text>

  <rect x="185" y="566" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="240" y="579" text-anchor="middle" font-size="9" fill="#333">color_enhance</text>
  <text x="240" y="591" text-anchor="middle" font-size="9" fill="#333">concat_clips</text>

  <rect x="305" y="566" width="110" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="360" y="579" text-anchor="middle" font-size="9" fill="#333">add_text_overlay</text>
  <text x="360" y="591" text-anchor="middle" font-size="9" fill="#333">mix_audio_bgm</text>

  <rect x="425" y="566" width="115" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="482" y="579" text-anchor="middle" font-size="9" fill="#333">export_mp4</text>
  <text x="482" y="591" text-anchor="middle" font-size="9" fill="#333">l0_atomic_tools.py</text>

  <!-- L1 -->
  <rect x="575" y="498" width="190" height="136" rx="8" fill="#fffbee" stroke="#d4a017" stroke-width="1"/>
  <text x="670" y="516" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6000">L1 集成工具</text>
  <rect x="595" y="524" width="155" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="672" y="537" text-anchor="middle" font-size="9" fill="#333">search_by_text</text>
  <text x="672" y="549" text-anchor="middle" font-size="9" fill="#333">summarize_results</text>
  <rect x="595" y="566" width="155" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="672" y="580" text-anchor="middle" font-size="9" fill="#333">l1_integrated_tools.py</text>
  <text x="672" y="592" text-anchor="middle" font-size="9" fill="#888">VLM 语义检索</text>

  <!-- L2 -->
  <rect x="785" y="498" width="255" height="136" rx="8" fill="#fffbee" stroke="#d4a017" stroke-width="1"/>
  <text x="912" y="516" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6000">L2 垂直工具</text>
  <rect x="805" y="524" width="215" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="912" y="537" text-anchor="middle" font-size="9" fill="#333">draft_edit_plan</text>
  <text x="912" y="549" text-anchor="middle" font-size="9" fill="#333">l2_vertical_tools.py</text>
  <rect x="805" y="566" width="215" height="34" rx="5" fill="#fff" stroke="#e0b840" stroke-width="1"/>
  <text x="912" y="580" text-anchor="middle" font-size="9" fill="#333">高级编辑方案生成</text>
  <text x="912" y="592" text-anchor="middle" font-size="9" fill="#888">（策略规划输出）</text>

  <!-- ============ Foundation Layer ============ -->
  <rect x="30" y="670" width="1040" height="120" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="692" font-size="12" font-weight="bold" fill="#1a4a1a">基础设施层（Foundation）</text>

  <rect x="55" y="702" width="185" height="72" rx="8" fill="#fff" stroke="#4caf50" stroke-width="1.2"/>
  <text x="147" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a1a">LibraryService</text>
  <text x="147" y="738" text-anchor="middle" font-size="10" fill="#555">library.py</text>
  <text x="147" y="752" text-anchor="middle" font-size="9" fill="#888">相册扫描 / 资产索引</text>
  <text x="147" y="764" text-anchor="middle" font-size="9" fill="#888">快速扫描(enrich_vlm=False)</text>

  <rect x="260" y="702" width="200" height="72" rx="8" fill="#fff" stroke="#4caf50" stroke-width="1.2"/>
  <text x="360" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a1a">MediaOps</text>
  <text x="360" y="738" text-anchor="middle" font-size="10" fill="#555">media_ops.py</text>
  <text x="360" y="752" text-anchor="middle" font-size="9" fill="#888">ffmpeg / ffprobe / OpenCV</text>
  <text x="360" y="764" text-anchor="middle" font-size="9" fill="#888">三拼 · 编码 · Live Photo 打包</text>

  <rect x="480" y="702" width="195" height="72" rx="8" fill="#fff" stroke="#4caf50" stroke-width="1.2"/>
  <text x="577" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a1a">VLMSemanticAnalyzer</text>
  <text x="577" y="738" text-anchor="middle" font-size="10" fill="#555">vlm_semantics.py</text>
  <text x="577" y="752" text-anchor="middle" font-size="9" fill="#888">多模态图文理解</text>
  <text x="577" y="764" text-anchor="middle" font-size="9" fill="#888">离线预处理时调用</text>

  <rect x="695" y="702" width="200" height="72" rx="8" fill="#fff" stroke="#4caf50" stroke-width="1.2"/>
  <text x="795" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a1a">OfflinePreprocessIndexer</text>
  <text x="795" y="738" text-anchor="middle" font-size="10" fill="#555">preprocess_index.py</text>
  <text x="795" y="752" text-anchor="middle" font-size="9" fill="#888">离线构建预处理索引</text>
  <text x="795" y="764" text-anchor="middle" font-size="9" fill="#888">VLM + 封面帧分析</text>

  <rect x="915" y="702" width="140" height="72" rx="8" fill="#fff" stroke="#4caf50" stroke-width="1.2"/>
  <text x="985" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a1a">MemoryService</text>
  <text x="985" y="738" text-anchor="middle" font-size="10" fill="#555">memory.py</text>
  <text x="985" y="752" text-anchor="middle" font-size="9" fill="#888">会话 / 多模态记忆</text>
  <text x="985" y="764" text-anchor="middle" font-size="9" fill="#888">可复用策略推荐</text>

  <!-- ============ Arrows ============ -->
  <!-- UI → API -->
  <line x1="220" y1="118" x2="270" y2="118" stroke="#5a7bab" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API → Agent -->
  <line x1="370" y1="144" x2="370" y2="185" stroke="#4a9a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent → InputPreprocessor → GraphRunner -->
  <line x1="230" y1="253" x2="270" y2="253" stroke="#4a9a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="253" x2="480" y2="253" stroke="#4a9a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GraphRunner → QwenPlanner -->
  <line x1="572" y1="305" x2="375" y2="330" stroke="#c87a3a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- QwenPlanner → LLM backends -->
  <line x1="225" y1="393" x2="585" y2="393" stroke="#7a5aab" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- GraphRunner → ToolRegistry (capability) -->
  <line x1="572" y1="440" x2="572" y2="465" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ToolRegistry → Foundation -->
  <line x1="572" y1="650" x2="572" y2="670" stroke="#388e3c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- offline CLI → Foundation (OfflinePreprocessIndexer) -->
  <line x1="850" y1="144" x2="795" y2="670" stroke="#388e3c" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="55" y="612" width="490" height="40" rx="6" fill="#fffff0" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="632" x2="100" y2="632" stroke="#5a7bab" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="107" y="636" font-size="10" fill="#555">主数据流</text>
  <line x1="185" y1="632" x2="215" y2="632" stroke="#5a7bab" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="222" y="636" font-size="10" fill="#555">LLM 调用 / 离线</text>
  <text x="345" y="636" font-size="10" fill="#888">output: .agent_work/ (timeline · exports · live_photo)</text>
</svg>